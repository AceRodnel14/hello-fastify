{{- if and .Values.ingress.enabled (eq .Values.ingress.style "ingressRoute") -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "hello-fastify.fullname" . }}
  labels:
    {{- include "hello-fastify.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ include "hello-fastify.fullname" . }}
          port: {{ .Values.service.port }}
          {{- if .Values.ingress.sticky.enabled }}
          sticky:
            cookie:
              name: {{ .Values.ingress.sticky.cookieName }}
              secure: {{ .Values.ingress.sticky.secure }}
              httpOnly: {{ .Values.ingress.sticky.httpOnly }}
          {{- end }}
  # tls: is intentionally omitted — this stays plain HTTP on the `web`
  # entrypoint. If TLS termination is ever needed, add a `tls:` block
  # here (or a separate IngressRouteTCP/cert-resolver setup) and put
  # `websecure` in ingress.entryPoints — the Service/Pod still only
  # ever see plain HTTP either way.
{{- end -}}
