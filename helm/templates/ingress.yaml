{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hello-fastify.fullname" . }}
  labels:
    {{- include "hello-fastify.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entryPoint }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hello-fastify.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  # No `tls:` block here on purpose — plain HTTP over the `web`
  # entrypoint only. No HTTPS conversion for this service.
{{- end -}}
