apiVersion: v1
kind: Service
metadata:
  name: {{ include "hello-fastify.fullname" . }}
  labels:
    {{- include "hello-fastify.labels" . | nindent 4 }}
  {{- if and .Values.ingress.sticky.enabled (eq .Values.ingress.style "ingress") }}
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: {{ .Values.ingress.sticky.cookieName | quote }}
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: {{ .Values.ingress.sticky.secure | quote }}
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: {{ .Values.ingress.sticky.httpOnly | quote }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "hello-fastify.selectorLabels" . | nindent 4 }}
