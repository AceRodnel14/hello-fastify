replicaCount: 2
# Note: replicaCount is only used when keda.enabled is false — once KEDA
# owns the ScaledObject, it takes over setting spec.replicas on the
# Deployment (min/maxReplicaCount below control the range instead).

keda:
  enabled: false
  minReplicaCount: 2
  maxReplicaCount: 10
  # Both triggers are evaluated independently; KEDA scales to satisfy
  # whichever one wants more replicas at any given moment — so "either
  # CPU or memory hits the threshold" is the default behavior already.
  cpuUtilization: 75
  memoryUtilization: 75

image:
  repository: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/hello-fastify
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 8000
  targetPort: 8000

# Plain HTTP only — Ingress routed through the existing Traefik on the
# `web` entrypoint. No TLS, no HTTPS conversion.
ingress:
  enabled: true
  # Left empty to match how every other Ingress in this cluster is set up
  # (no ingressClassName set) — Traefik picks them up regardless. Set this
  # if that ever changes or a second controller gets added to the cluster.
  className: ""
  host: hello-fastify.example.com
  entryPoint: web

  annotations: {}

  # Sticky sessions — pins a client to the pod it first landed on via a
  # cookie, set as annotations on the Service (see service.yaml).
  # Note: on scale-down, a session pinned to a pod that gets terminated
  # loses its stickiness — KEDA scaling and sticky sessions can interact.
  sticky:
    enabled: false
    cookieName: hello-fastify-affinity
    secure: true
    httpOnly: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop: ["ALL"]

env:
  SERVICE_NAME: hello-fastify
  LOG_LEVEL: info
  # VAR: someone   # optional — server.ts defaults to "world" if unset

nodeSelector: {}
tolerations: []
affinity: {}
